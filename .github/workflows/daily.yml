name: 百十个杀码每日更新

on:
  push:
    branches: [main]   # 代码变更推送后立即构建并部署 Pages
  schedule:
    # 北京时间 22:00 (UTC 14:00) — 开奖(21:15)后执行
    - cron: '0 14 * * *'
    # 北京时间 23:30 (UTC 15:30) — 第一次兜底
    - cron: '30 15 * * *'
    # 北京时间 01:00 (UTC 17:00) — 第二次兜底
    - cron: '0 17 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}

    # 同一时间只允许一次 Pages 部署，避免脏并发
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 构建
        run: go build -o fc3d-kill6 .

      - name: 运行云端更新
        run: ./fc3d-kill6

      - name: 提交变更
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add fc3d-history.csv ssq-history.csv index.html kill6_history.json \
            pl3-history.csv pl5-history.csv qxc-history.csv dlt-history.csv qlc-history.csv kl8-history.csv
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "自动更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi

      - name: 准备 Pages 产物
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages

      # deploy-pages 偶发在上传刚结束时查不到产物（Found 0 artifact(s)），
      # 先失败不中断，等产物元数据同步后重试一次。
      - name: 部署到 GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 等待产物同步
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: 部署重试
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
